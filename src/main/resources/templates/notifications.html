<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="/fragments/header :: mainHeader"></div>

<div class="container my-4" style="max-width: 720px;">
    <h1 class="h4 mb-3">Notifications</h1>

    <p th:if="${notifications.isEmpty()}" class="lead text-center py-5">
        No notifications yet. You will be told here when someone new matches one of your searches.
    </p>

    <div class="list-group">
        <a th:each="n : ${notifications}" th:href="${n.link}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-3"
           th:classappend="${n.unread} ? 'fw-semibold'">
            <span>
                <span th:if="${n.unread}" class="badge bg-danger me-1">New</span>
                <span th:text="${n.text}"></span>
            </span>
            <small class="text-muted text-nowrap"
                   th:text="${n.createdAtShown}"></small>
        </a>
    </div>
</div>

<footer th:replace="/fragments/footer :: mainFooter"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
