<header th:fragment="mainHeader" style="height: 8vh">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger" style="z-index: 1;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/home">Dating App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/matches">Matches</a></li>
                    <li class="nav-item" th:if="${me != null}"><a class="nav-link" href="/chat">Chats</a></li>
                    <li class="nav-item" th:if="${me != null}">
                        <!-- FR-6: unread new-match notifications; notifications.js raises the number live -->
                        <a class="nav-link position-relative" href="/notifications" id="notificationBell"
                           th:data-csrf-token="${_csrf.token}" th:data-csrf-header="${_csrf.headerName}"
                           th:aria-label="${'Notifications, ' + unreadNotifications + ' unread'}">
                            <span aria-hidden="true">&#128276;</span> Notifications
                            <span id="notificationCount" class="badge rounded-pill bg-light text-danger"
                                  th:classappend="${unreadNotifications == 0} ? 'd-none'" th:text="${unreadNotifications}">0</span>
                        </a>
                    </li>

                    <li class="nav-item" th:if="${me == null}">
                        <a class="nav-link" href="/auth/v1/login">Login</a>
                    </li>
                    <li class="nav-item" th:if="${me == null}">
                        <a class="btn btn-light text-danger ms-2" href="/auth/v1/signup">Sign Up</a>
                    </li>

                    <li class="nav-item dropdown" th:if="${me != null}">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button"
                           style="gap: 5px; border: 1px solid white; border-radius: 5px;"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${'/file/avatar/' + me.username + '.png'}" Width="24px" Height="24px" Style="border-radius: 50%" />
                            <p style=" margin: 0;" th:text="${me.firstName}"></p>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="${'/profile/' + me.username}">Profile</a></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <th:block th:if="${me != null}">
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
        <script src="/notifications.js"></script>
    </th:block>
</header>
