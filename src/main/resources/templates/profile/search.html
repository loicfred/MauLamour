<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${search.ID == null ? 'New search' : 'Edit search'}">Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/tag-picker.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<div th:replace="/fragments/header :: mainHeader"></div>

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <h1 class="h3 mb-1" th:text="${search.ID == null ? 'Describe who you are looking for' : 'Edit your search'}"></h1>
            <p class="text-muted">Leave anything you don't mind about empty: only what you fill in counts towards the match %.</p>

            <form th:action="@{/post/profile/search}" method="post" id="searchForm">
                <input type="hidden" name="ID" th:value="${search.ID}" />

                <!-- Name -->
                <div class="mb-3">
                    <label for="Name" class="form-label fw-semibold">Name of this search</label>
                    <input type="text" id="Name" name="Name" th:value="${search.Name}" maxlength="60" required
                           class="form-control" placeholder="For example Weekend in Curepipe">
                </div>

                <!-- Age, height, distance -->
                <div class="row g-2 mb-3">
                    <div class="col-6 col-md-3">
                        <label for="MinAge" class="form-label fw-semibold">Age from</label>
                        <input type="number" id="MinAge" name="MinAge" min="18" max="99" th:value="${search.MinAge}" class="form-control">
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="MaxAge" class="form-label fw-semibold">Age to</label>
                        <input type="number" id="MaxAge" name="MaxAge" min="18" max="99" th:value="${search.MaxAge}" class="form-control">
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="MinHeightCm" class="form-label fw-semibold">Height from (cm)</label>
                        <input type="number" id="MinHeightCm" name="MinHeightCm" min="100" max="250" th:value="${search.MinHeightCm}" class="form-control">
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="MaxHeightCm" class="form-label fw-semibold">Height to (cm)</label>
                        <input type="number" id="MaxHeightCm" name="MaxHeightCm" min="100" max="250" th:value="${search.MaxHeightCm}" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="LocationRadiusKM" class="form-label fw-semibold">Lives within (km)</label>
                    <input type="number" id="LocationRadiusKM" name="LocationRadiusKM" min="1" th:value="${search.LocationRadiusKM}"
                           class="form-control" aria-describedby="radiusHelp">
                    <div id="radiusHelp" class="form-text">Measured from the location on your own profile.</div>
                </div>

                <div class="accordion" id="searchAccordion">
                    <!-- One section per group of choices: tick every answer you would accept -->
                    <div class="accordion-item" th:each="section, s : ${T(my.dating.app.object.enums.SearchChoice).bySection()}">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    th:data-bs-target="${'#section' + s.index}" th:text="${section.key}"></button>
                        </h2>
                        <div th:id="${'section' + s.index}" class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                <div class="mb-3" th:each="choice : ${section.value}">
                                    <span th:id="${choice.name() + '-label'}" class="form-label fw-semibold d-block" th:text="${choice.label}"></span>
                                    <div th:data-choice-group="${choice.name()}" role="group" th:aria-labelledby="${choice.name() + '-label'}">
                                        <button type="button" class="choice-tag" th:each="opt : ${choice.options}"
                                                th:data-value="${opt.name()}" th:text="${opt.displayName}"></button>
                                    </div>
                                    <div th:data-choice-inputs="${choice.name()}">
                                        <input type="hidden" th:each="v : ${search.getChoices().get(choice)}"
                                               th:name="${choice.name()}" th:value="${v}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#sectionYesNo">Yes or no</button>
                        </h2>
                        <div id="sectionYesNo" class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                <div class="mb-3" th:each="setting : ${T(my.dating.app.object.Search_Profile).YES_NO_SETTINGS}"
                                     th:with="wanted=${setting.wanted().apply(search)}">
                                    <label th:for="${setting.field()}" class="form-label fw-semibold" th:text="${setting.label()}"></label>
                                    <select th:id="${setting.field()}" th:name="${setting.field()}" class="form-select">
                                        <option value="" th:selected="${wanted == null}">I don't mind</option>
                                        <option value="true" th:selected="${wanted == true}">Yes</option>
                                        <option value="false" th:selected="${wanted == false}">No</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:unless="${errors.isEmpty()}" class="alert alert-danger mt-3" role="alert">
                    <p class="mb-1 fw-semibold">Nothing was saved yet. Please fix:</p>
                    <ul class="mb-0"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
                </div>

                <div class="d-grid my-3">
                    <button type="submit" class="btn btn-primary btn-lg">Save search</button>
                </div>
            </form>

            <form th:if="${search.ID != null}" th:action="@{'/post/profile/search/' + ${search.ID} + '/delete'}" method="post"
                  onsubmit="return confirm('Delete this search? This cannot be undone.');" class="d-grid mb-4">
                <button type="submit" class="btn btn-outline-danger">Delete this search</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="/fragments/footer :: mainFooter"></footer>
<script src="/tag-picker.js"></script>
</body>
</html>
